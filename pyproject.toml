[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ibci-datasets"
version = "0.1.0.dev0"
description = "One reader per public human intracortical BCI dataset, with writers for NWB and torch_brain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ibci-datasets contributors" }]
keywords = ["brain-computer interface", "BCI", "intracortical", "NWB", "BrainGate", "neural decoding"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
]

[project.optional-dependencies]
nwb = ["pynwb>=2.8"]
torch-brain = ["torch_brain>=0.2.1"]
dev = ["pytest>=8", "pynwb>=2.8"]

[project.scripts]
ibci = "ibci_datasets.cli:main"

[project.urls]
Catalog = "https://github.com/cabibbz/ibci-datasets#datasets"

[tool.hatch.build.targets.wheel]
packages = ["src/ibci_datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
